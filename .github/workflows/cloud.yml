name: Cloud

# Push to main: check, bump the patch version, tag it, and push images to GHCR.
# Deploy: manual only. Run it from the Actions tab, enter the version, and type "deploy".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy, without the v prefix (for example 0.1.1)'
        required: true
        type: string
      confirm:
        description: 'Type deploy to confirm'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd web --frozen-lockfile
      - run: bun install --cwd server --frozen-lockfile
      - run: bun run cloud:typecheck
      - run: bun run api:typecheck
      - run: bun run api:test
      - run: bun run cloud:build

  version:
    needs: check
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Bump patch version, commit, and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(bun scripts/bump-version.ts)
          git add package.json
          git commit -m "Release v${VERSION} [skip release]"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:main "v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: server
            file: server/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/api-documentation-cloud-${{ matrix.name }}:v${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/api-documentation-cloud-${{ matrix.name }}:sha-${{ needs.version.outputs.sha }}

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
      IMAGE_TAG: v${{ inputs.version }}
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "Type 'deploy' in the confirm field to deploy."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Copy compose file
        run: scp -i ~/.ssh/id_deploy docker-compose.prod.yml "$VPS:~/api-docs-cloud/"
      - name: Log in to GHCR, pull, and start
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy "$VPS" \
            "docker login ghcr.io -u $GHCR_USER --password-stdin && cd ~/api-docs-cloud && IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull && IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker logout ghcr.io"
      - name: Health check
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS" \
            "for i in \$(seq 1 20); do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 3; done; exit 1"
