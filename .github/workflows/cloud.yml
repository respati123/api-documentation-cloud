name: Cloud

# Push or PR to main: check only (typecheck, test, build).
# Push a tag v*.*.*: re-check at the tag, then build and push images to GHCR.
# Deploy: manual only, from the Actions tab, by entering an existing version.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy, without the v prefix (for example 0.1.4)'
        required: true
        type: string
      confirm:
        description: 'Type deploy to confirm'
        required: true
        type: string

# Minimal by default. Jobs widen their own scope when they need to.
permissions:
  contents: read

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd web --frozen-lockfile
      - run: bun install --cwd server --frozen-lockfile
      - run: bun run cloud:typecheck
      - run: bun run cloud:lint
      - run: bun run cloud:test
      - run: bun run api:typecheck
      - run: bun run api:test
      - run: bun run cloud:build

  release-check:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like v0.1.5, got: $TAG"; exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd web --frozen-lockfile
      - run: bun install --cwd server --frozen-lockfile
      - run: bun run cloud:typecheck
      - run: bun run cloud:lint
      - run: bun run cloud:test
      - run: bun run api:typecheck
      - run: bun run api:test
      - run: bun run cloud:build

  image-api:
    needs: release-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apidocs
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: apidocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apidocs -d apidocs"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/api-documentation-cloud-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the API image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
      - name: Smoke test the API container
        run: |
          docker run -d --name api-smoke --network host \
            -e DATABASE_URL=postgres://apidocs:smoke@127.0.0.1:5432/apidocs \
            -e PUBLIC_WEB_URL=http://localhost:3000 \
            -e PORT=3001 \
            "${IMAGE}:${{ github.ref_name }}"
          for i in $(seq 1 20); do
            if docker exec api-smoke bun -e "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "API healthy"; docker rm -f api-smoke; exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy"; docker logs api-smoke; docker rm -f api-smoke; exit 1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the API image
        run: |
          docker push "${IMAGE}:${{ github.ref_name }}"
          docker push "${IMAGE}:sha-${{ github.sha }}"

  image-web:
    needs: release-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/api-documentation-cloud-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive the app version from the tag
        id: ver
        run: echo "app=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.app }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy" ]; then
            echo "Type 'deploy' in the confirm field to deploy."; exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must look like 0.1.4 (digits and dots only)."; exit 1
          fi
          echo "IMAGE_TAG=v${VERSION}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify both images exist for this version
        run: |
          for name in api web; do
            ref="ghcr.io/${OWNER}/api-documentation-cloud-${name}:${IMAGE_TAG}"
            if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "Image not found in GHCR: $ref"
              echo "Push the tag ${IMAGE_TAG} first, and wait for its build to finish."
              exit 1
            fi
          done
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Copy compose file
        run: scp -i ~/.ssh/id_deploy docker-compose.prod.yml "$VPS:~/api-docs-cloud/"
      - name: Log in to GHCR, pull, and start
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy "$VPS" \
            "docker login ghcr.io -u $GHCR_USER --password-stdin && cd ~/api-docs-cloud && IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull && IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker logout ghcr.io"
      - name: Health check
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS" \
            "for i in \$(seq 1 20); do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 3; done; exit 1"
