name: Cloud Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: cloud-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apidocs
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apidocs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apidocs -d apidocs_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://apidocs:test@127.0.0.1:5432/apidocs_test
      PUBLIC_WEB_URL: http://localhost:5174
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like v0.1.5, got: $TAG"; exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cloud-build-test

  image-api:
    needs: release-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apidocs
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: apidocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apidocs -d apidocs"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/api-documentation-cloud-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the API image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
      - name: Smoke test the API container
        run: |
          docker run -d --name api-smoke --network host \
            -e DATABASE_URL=postgres://apidocs:smoke@127.0.0.1:5432/apidocs \
            -e PUBLIC_WEB_URL=http://localhost:3000 \
            -e PORT=3001 \
            "${IMAGE}:${{ github.ref_name }}"
          for i in $(seq 1 20); do
            if docker exec api-smoke bun -e "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "API healthy"; docker rm -f api-smoke; exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy"; docker logs api-smoke; docker rm -f api-smoke; exit 1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the API image
        run: |
          docker push "${IMAGE}:${{ github.ref_name }}"
          docker push "${IMAGE}:sha-${{ github.sha }}"

  image-web:
    needs: release-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/api-documentation-cloud-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Derive the app version from the tag
        id: ver
        run: echo "app=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build the web image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.app }}
            VITE_AGILE_PROJECT=true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
      - name: Smoke test the web container
        run: |
          # nginx resolves the api upstream at startup. Without it the container exits immediately,
          # so the stand-in below is required for the container to come up at all, not just for /health.
          docker network create web-smoke
          docker run -d --name web-smoke-api --network web-smoke --network-alias api nginx:1.27-alpine \
            sh -c "echo 'server { listen 3001; location / { return 200; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
          docker run -d --name web-smoke --network web-smoke -p 18080:80 "${IMAGE}:${{ github.ref_name }}"
          ok=false
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:18080/ >/dev/null && [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/health)" = "200" ]; then
              ok=true; break
            fi
            sleep 1
          done
          if [ "$ok" != "true" ]; then
            echo "web container did not become healthy"
            docker logs web-smoke; docker logs web-smoke-api
            docker rm -f web-smoke web-smoke-api
            exit 1
          fi
          echo "web healthy"
          docker rm -f web-smoke web-smoke-api
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the web image
        run: |
          docker push "${IMAGE}:${{ github.ref_name }}"
          docker push "${IMAGE}:sha-${{ github.sha }}"
