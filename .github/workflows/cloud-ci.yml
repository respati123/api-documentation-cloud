name: Cloud CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cloud-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apidocs
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apidocs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apidocs -d apidocs_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://apidocs:test@127.0.0.1:5432/apidocs_test
      PUBLIC_WEB_URL: http://localhost:5174
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cloud-build-test
