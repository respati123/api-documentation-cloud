name: Cloud build and test
description: Install, typecheck, lint, test, and build the web portal and the server API. Shared by the check and release-check jobs so they cannot drift apart.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.2
    - run: bun install --cwd web --frozen-lockfile
      shell: bash
    - run: bun install --cwd server --frozen-lockfile
      shell: bash
    - run: bun run cloud:typecheck
      shell: bash
    - run: bun run cloud:lint
      shell: bash
    - run: bun run cloud:test
      shell: bash
    - run: bun run api:typecheck
      shell: bash
    # Without a database the route tests skip themselves and the run still passes.
    - run: |
        if [ -z "$TEST_DATABASE_URL" ]; then
          echo "TEST_DATABASE_URL is not set, so the route tests would be skipped."; exit 1
        fi
        bun run api:test
      shell: bash
    - run: bun run cloud:build
      shell: bash
