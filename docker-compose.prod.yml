# Production stack. Images come from GitHub Container Registry and are selected by IMAGE_TAG.
# The Cloud workflow writes non-secret settings to .env and mounts secret files under /run/secrets.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apidocs
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: apidocs
    secrets:
      - postgres_password
    volumes:
      - apidocs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apidocs -d apidocs"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/respati123/api-documentation-cloud-api:${IMAGE_TAG:?set IMAGE_TAG, for example v0.1.1}
    restart: unless-stopped
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      PORT: ${API_PORT?set API_PORT in PRODUCTION_ENV}
      LOG_LEVEL: ${LOG_LEVEL?set LOG_LEVEL in PRODUCTION_ENV}
      DB_POOL_MAX: ${DB_POOL_MAX?set DB_POOL_MAX in PRODUCTION_ENV}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS?set DB_STATEMENT_TIMEOUT_MS in PRODUCTION_ENV}
      SMTP_HOST: ${SMTP_HOST?set SMTP_HOST in PRODUCTION_ENV}
      SMTP_PORT: ${SMTP_PORT?set SMTP_PORT in PRODUCTION_ENV}
      SMTP_SECURE: ${SMTP_SECURE?set SMTP_SECURE in PRODUCTION_ENV}
      SMTP_USER_FILE: /run/secrets/smtp_user
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_FROM: ${SMTP_FROM?set SMTP_FROM in PRODUCTION_ENV}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS?set CORS_ORIGINS in PRODUCTION_ENV}
      OIDC_SIGNING_KEY_B64_FILE: /run/secrets/oidc_signing_key_b64
      OIDC_SIGNING_KEY_ID: ${OIDC_SIGNING_KEY_ID?set OIDC_SIGNING_KEY_ID in PRODUCTION_ENV}
      DBDESIGN_URL: ${DBDESIGN_URL?set DBDESIGN_URL in PRODUCTION_ENV}
      STITCHKIT_URL: ${STITCHKIT_URL?set STITCHKIT_URL in PRODUCTION_ENV}
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - database_url
      - smtp_user
      - smtp_password
      - oidc_signing_key_b64
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    image: ghcr.io/respati123/api-documentation-cloud-web:${IMAGE_TAG:?set IMAGE_TAG, for example v0.1.1}
    restart: unless-stopped
    # Only localhost is published. The Cloudflare Tunnel forwards the public domain here.
    ports:
      - "127.0.0.1:${CLOUD_WEB_PORT?set CLOUD_WEB_PORT in PRODUCTION_ENV}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  apidocs-postgres:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  smtp_user:
    file: ./secrets/smtp_user
  smtp_password:
    file: ./secrets/smtp_password
  oidc_signing_key_b64:
    file: ./secrets/oidc_signing_key_b64
