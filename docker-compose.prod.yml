# Production stack. Images come from GitHub Container Registry and are selected by IMAGE_TAG.
# Deployed by the "Cloud" workflow over SSH. The .env file on the server holds the secrets.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apidocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: apidocs
    volumes:
      - apidocs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apidocs -d apidocs"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/respati123/api-documentation-cloud-api:${IMAGE_TAG:?set IMAGE_TAG, for example v0.1.1}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://apidocs:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/apidocs
      PORT: 3001
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-API Documentation <no-reply@example.test>}"
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    image: ghcr.io/respati123/api-documentation-cloud-web:${IMAGE_TAG:?set IMAGE_TAG, for example v0.1.1}
    restart: unless-stopped
    # Only localhost is published. The Cloudflare Tunnel forwards the public domain here.
    ports:
      - "127.0.0.1:${CLOUD_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  apidocs-postgres:
